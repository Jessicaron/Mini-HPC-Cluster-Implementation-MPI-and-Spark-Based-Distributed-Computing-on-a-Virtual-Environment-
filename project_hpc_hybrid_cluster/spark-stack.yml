version: "3.8"

services:
  spark-master:
    image: spark:3.5.0
    user: "0"
    hostname: spark-master
    command: >
      /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
      --host spark-master
      --port 7077
      --webui-port 8080
    ports:
      - "8080:8080"
      - "7077:7077"
    networks:
      - spark-net
    deploy:
      placement:
        constraints:
          - node.hostname == master

  spark-worker:
    image: spark:3.5.0
    user: "0"
    command: >
      /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077
      --cores 1
      --memory 512m
      --webui-port 8081
    networks:
      - spark-net
    deploy:
      replicas: 2
      placement:
        constraints:
          - node.hostname == master
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 256M

networks:
  spark-net:
    driver: overlay
